services:
  linkgear:
    build:
      context: .
      dockerfile: Dockerfile
    image: sunshow/linkgear:latest
    ports:
      - "8080:8080"
    environment:
      - LINKGEAR_HTTP_ADDR=:8080
      - LINKGEAR_PUBLIC_URL=${LINKGEAR_PUBLIC_URL:-http://localhost:8080}
      - LINKGEAR_DSN=postgres://linkgear:linkgear@db:5432/linkgear?sslmode=disable
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linkgear
      POSTGRES_PASSWORD: linkgear
      POSTGRES_DB: linkgear
    volumes:
      - linkgear_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linkgear -d linkgear"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  linkgear_pg:
